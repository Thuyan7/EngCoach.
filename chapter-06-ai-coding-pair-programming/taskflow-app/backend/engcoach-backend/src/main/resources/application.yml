spring:
  application:
    name: engcoach-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/engcoach}
    username: ${DB_USERNAME:root}
    # No default on purpose (finding R3): a missing DB_PASSWORD stops the application at startup.
    # Local development gets 1234 from the dev profile (application-dev.yml).
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # update is fine for an academic MVP with a single small team; revisit
      # (e.g. Flyway/Liquibase) only if this needs to survive past the course.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

engcoach:
  jwt:
    # No default on purpose (finding R3, ADR-001): a missing JWT_SECRET stops the application at startup.
    # Local development gets a dev-only secret from the dev profile (application-dev.yml).
    secret: ${JWT_SECRET}
  cors:
    # Comma-separated frontend origins allowed to call the API from a browser,
    # e.g. https://engcoach.vercel.app. Empty = none (local dev uses the Vite proxy).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  anthropic:
    # S8b / ADR-004: server-side only, never exposed to the client. No
    # working default on purpose — an unset ANTHROPIC_API_KEY means every
    # explanation call is treated as UNAVAILABLE (approved decision #7),
    # not a startup failure, so the rest of the app still runs without it
    # (e.g. this sandbox, or a dev machine with no key).
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-3-5-haiku-latest}
    # R2: one call is cut off after `timeout`; one submit spends at most `submit-budget` on explanations,
    # the rest stay UNAVAILABLE and can be retried.
    timeout: ${ANTHROPIC_TIMEOUT:10s}
    submit-budget: ${ANTHROPIC_SUBMIT_BUDGET:20s}
  question-bank:
    # All three are off by default (finding R3); the dev profile turns them on for local development.
    # Opt-in local-only starter data.
    seed-samples: ${ENGCOACH_SEED_SAMPLE_QUESTIONS:false}
    # Opt-in: nạp các đề test-*.json do tools/question-generator sinh ra (bỏ qua đề đã có cùng tiêu đề).
    import-generated: ${ENGCOACH_IMPORT_GENERATED_TESTS:false}
    # Opt-in: đề đã có cùng tiêu đề thì cập nhật nội dung/audio/ảnh tại chỗ thay vì bỏ qua (dùng sau khi sinh lại audio).
    refresh-generated: ${ENGCOACH_REFRESH_GENERATED_TESTS:false}

server:
  port: ${PORT:8080}
