spring:
  application:
    name: engcoach-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/engcoach}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      # update is fine for an academic MVP with a single small team; revisit
      # (e.g. Flyway/Liquibase) only if this needs to survive past the course.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

engcoach:
  jwt:
    # MUST be overridden via the JWT_SECRET env var in Railway (ADR-001).
    # This default is for local dev only — do not deploy with it.
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-any-real-deploy-32chars}
  anthropic:
    # S8b / ADR-004: server-side only, never exposed to the client. No
    # working default on purpose — an unset ANTHROPIC_API_KEY means every
    # explanation call is treated as UNAVAILABLE (approved decision #7),
    # not a startup failure, so the rest of the app still runs without it
    # (e.g. this sandbox, or a dev machine with no key).
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-3-5-haiku-latest}
  question-bank:
    # Opt-in local-only starter data. Leave false for normal/production deployments.
    seed-samples: ${ENGCOACH_SEED_SAMPLE_QUESTIONS:false}

server:
  port: ${PORT:8080}
