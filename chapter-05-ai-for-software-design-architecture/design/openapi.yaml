openapi: 3.0.3
info:
  title: EngCoach API
  version: "1.0"
  description: >
    API for EngCoach, a TOEIC Reading & Listening practice platform.
    All endpoints except auth require a Bearer JWT.
servers:
  - url: /api

paths:
  /auth/register:
    post:
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201": { description: Account created, session token returned (auto-login) }
        "422": { description: Validation failure (RFC 9457 problem) }
        "409": { description: Email already registered (RFC 9457 problem) }

  /auth/login:
    post:
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { description: JWT access token returned }
        "401": { description: Invalid credentials, generic message (RFC 9457 problem) }

  /auth/forgot-password:
    post:
      summary: Request a password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: Generic confirmation regardless of whether the email exists }

  /auth/reset-password:
    post:
      summary: Set a new password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200": { description: Password updated }
        "410": { description: Token expired or already used (RFC 9457 problem) }
        "422": { description: Validation failure, e.g. newPassword too short (RFC 9457 problem) }

  /parts:
    get:
      summary: List TOEIC Parts available for practice
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: >
            Distinct Parts with at least one question available. Empty
            array if no questions have been added yet — not an error.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /attempts:
    post:
      summary: Start a Part practice or mock test attempt
      description: >
        If an IN_PROGRESS attempt already exists for this user scoped by
        (type, part), that attempt is returned instead of creating a new
        one (resume semantics, S6a). `part` is required for
        PART_PRACTICE and ignored for MOCK_TEST.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [PART_PRACTICE, MOCK_TEST] }
                part: { type: string, nullable: true }
      responses:
        "201": { description: Attempt created (or existing in-progress attempt resumed) }
        "422": { description: "PART_PRACTICE requested for a Part with no questions available yet (RFC 9457 problem)" }
    get:
      summary: List the authenticated user's attempt history
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: List of attempts, most recent first }

  /attempts/{id}:
    get:
      summary: Resume or inspect an attempt
      description: >
        Not restricted to IN_PROGRESS attempts (S7a) — works for any
        attempt the caller owns. `remainingSeconds` is null when the
        attempt has no time limit (every PART_PRACTICE attempt, and every
        MOCK_TEST attempt until S11 sets timeLimitSeconds); null means
        "untimed," not "0 seconds left."
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Attempt with saved answers and server-computed remaining time, restoring exact in-progress state
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  type: { type: string, enum: [PART_PRACTICE, MOCK_TEST] }
                  part: { type: string, nullable: true }
                  status: { type: string }
                  startedAt: { type: string, format: date-time }
                  remainingSeconds: { type: integer, nullable: true }
                  answers:
                    type: array
                    items:
                      type: object
                      properties:
                        questionId: { type: integer }
                        chosenOption: { type: string }
        "403": { description: Attempt belongs to another user (RFC 9457 problem) }
        "404": { description: Attempt does not exist (RFC 9457 problem) }
    delete:
      summary: Permanently delete an attempt
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "403": { description: Attempt belongs to another user (RFC 9457 problem) }

  /attempts/{id}/answers/{questionId}:
    put:
      summary: Auto-save one answer during an in-progress attempt
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: questionId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chosenOption]
              properties:
                chosenOption: { type: string }
      responses:
        "200": { description: Answer saved (re-answering the same question overwrites the prior value) }
        "403": { description: Attempt belongs to another user (RFC 9457 problem) }
        "404": { description: Attempt does not exist (RFC 9457 problem) }

  /attempts/{id}/submit:
    post:
      summary: Submit an attempt for grading
      description: >
        Grades every saved Answer against the question's correctOption and
        persists score/totalQuestions on the Attempt (S8a). Idempotent:
        resubmitting an already-SUBMITTED attempt returns the exact score
        persisted the first time rather than regrading — an answer saved
        after submission is never counted. For PART_PRACTICE,
        totalQuestions is every Question in the Part, so an unanswered
        question counts as incorrect (no Answer row exists for it). For
        MOCK_TEST, totalQuestions is currently only the count of answers
        actually saved, a known limitation until S11 assigns a real
        question set. Per-question AI explanations are S8b's scope, not
        returned here.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Score returned (double-submission is a no-op success, same persisted score)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  status: { type: string, enum: [SUBMITTED] }
                  score: { type: integer }
                  totalQuestions: { type: integer }
                  answers:
                    type: array
                    items:
                      type: object
                      properties:
                        questionId: { type: integer }
                        chosenOption: { type: string, nullable: true }
                        isCorrect: { type: boolean }
        "403": { description: Attempt belongs to another user (RFC 9457 problem) }
        "404": { description: Attempt does not exist (RFC 9457 problem) }

  /attempts/{id}/result:
    get:
      summary: Get the graded result and per-question explanations
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Score plus explanations; unavailable explanations flagged, not omitted }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT